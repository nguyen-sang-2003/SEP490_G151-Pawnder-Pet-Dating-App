name: Deploy to Azure App Service

on:
  push:
    branches:
      - deploy-azure
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
    
    - name: Clean
      run: dotnet clean BackEnd/BE/BE.csproj --configuration Release
    
    - name: Restore dependencies
      run: dotnet restore BackEnd/BE/BE.csproj
    
    - name: Build
      run: dotnet build BackEnd/BE/BE.csproj --configuration Release --no-restore
    
    - name: Publish
      run: dotnet publish BackEnd/BE/BE.csproj --configuration Release --output ./publish-output --no-build
    
    - name: Fix publish output structure
      run: |
        echo "=== Checking publish output ==="
        ls -la publish-output/ | head -20
        echo ""
        echo "=== Checking for conflicts ==="
        # Check if there's a file named "BE" (executable) that conflicts with directory
        if [ -f "publish-output/BE" ] && [ ! -d "publish-output/BE" ]; then
          echo "Found BE executable file, renaming to BE.exe"
          mv publish-output/BE publish-output/BE.exe || true
        fi
        # Check for nested directories
        if [ -d "publish-output/BE" ]; then
          echo "Found nested BE directory, flattening..."
          mv publish-output/BE/* publish-output/ 2>/dev/null || true
          rm -rf publish-output/BE
        fi
        if [ -d "publish-output/BackEnd" ]; then
          echo "Found nested BackEnd directory, flattening..."
          mv publish-output/BackEnd/* publish-output/ 2>/dev/null || true
          rm -rf publish-output/BackEnd
        fi
        echo "=== Final Structure ==="
        ls -la publish-output/ | head -20
    
    - name: Verify publish output
      run: |
        echo "=== Checking Required Files ==="
        if [ -f "publish-output/BE.dll" ]; then
          echo "✓ BE.dll found"
        else
          echo "✗ BE.dll not found - searching..."
          find publish-output -name "*.dll" -type f | head -5
        fi
        if [ -f "publish-output/appsettings.json" ]; then
          echo "✓ appsettings.json found"
        else
          echo "✗ appsettings.json not found"
        fi
        echo ""
        echo "=== File Count ==="
        echo "Total files: $(find publish-output -type f | wc -l)"
        echo "DLL files: $(find publish-output -name "*.dll" | wc -l)"
    
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'pawnder-backend-2025-westus'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./publish-output
