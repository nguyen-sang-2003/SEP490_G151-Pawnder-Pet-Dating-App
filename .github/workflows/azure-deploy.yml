name: Deploy to Azure App Service

on:
  push:
    branches:
      - CuongNTT
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore BE/BE/BE.csproj
    
    - name: Build
      run: dotnet build BE/BE/BE.csproj --configuration Release --no-restore
    
    - name: Publish
      run: dotnet publish BE/BE/BE.csproj --configuration Release --no-build --output ./publish
    
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'pawnder-api-2025'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./publish
