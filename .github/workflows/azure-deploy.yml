name: Deploy to Azure App Service

on:
  push:
    branches:
      - deploy-azure
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore BackEnd/BE/BE.csproj
    
    - name: Build
      run: dotnet build BackEnd/BE/BE.csproj --configuration Release --no-restore
    
    - name: Publish
      run: dotnet publish BackEnd/BE/BE.csproj --configuration Release --output ./publish-output --no-build
    
    - name: Verify publish output
      run: |
        echo "Listing publish-output contents:"
        ls -la publish-output/
        echo "Checking for required files:"
        if [ -f "publish-output/BE.dll" ]; then
          echo "✓ BE.dll found"
        else
          echo "✗ BE.dll not found"
          find publish-output -name "*.dll" -type f | head -5
        fi
        if [ -f "publish-output/appsettings.json" ]; then
          echo "✓ appsettings.json found"
        else
          echo "✗ appsettings.json not found"
        fi
    
    - name: Create deployment package
      run: |
        cd publish-output
        zip -r ../deploy-package.zip .
        cd ..
        echo "Package size:"
        ls -lh deploy-package.zip
    
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'pawnder-backend-2024'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./deploy-package.zip
        clean: true
