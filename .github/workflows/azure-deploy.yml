name: Deploy to Azure App Service

on:
  push:
    branches:
      - deploy-azure
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore BackEnd/BE/BE.csproj
    
    - name: Build
      run: dotnet build BackEnd/BE/BE.csproj --configuration Release --no-restore
    
    - name: Publish
      run: dotnet publish BackEnd/BE/BE.csproj --configuration Release --output ./publish-output --no-build
    
    - name: Remove nested directories if exists
      run: |
        if [ -d "publish-output/BE" ]; then
          mv publish-output/BE/* publish-output/ 2>/dev/null || true
          rm -rf publish-output/BE
          echo "Removed nested BE directory"
        fi
        if [ -d "publish-output/BackEnd" ]; then
          mv publish-output/BackEnd/* publish-output/ 2>/dev/null || true
          rm -rf publish-output/BackEnd
          echo "Removed nested BackEnd directory"
        fi
        echo "Listing publish-output contents:"
        ls -la publish-output/
    
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'pawnder-backend-2024'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./publish-output
        clean: true
