name: Deploy to Azure App Service

on:
  push:
    branches:
      - deploy-azure
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore BackEnd/BE/BE.csproj
    
    - name: Build
      run: dotnet build BackEnd/BE/BE.csproj --configuration Release --no-restore
    
    - name: Publish
      run: dotnet publish BackEnd/BE/BE.csproj --configuration Release --no-build --output ./publish-output
    
    - name: Remove nested BE directory if exists
      run: |
        if [ -d "publish-output/BE" ]; then
          rm -rf publish-output/BE
          echo "Removed nested BE directory"
        fi
        if [ -d "publish-output/BackEnd" ]; then
          rm -rf publish-output/BackEnd
          echo "Removed nested BackEnd directory"
        fi
    
    - name: Create deployment package
      run: cd publish-output && zip -r ../deploy.zip . && cd ..
    
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'pawnder-backend-2024'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./deploy.zip
        clean: true
