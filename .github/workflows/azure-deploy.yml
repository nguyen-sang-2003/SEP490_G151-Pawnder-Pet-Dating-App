name: Deploy to Azure App Service

on:
  push:
    branches:
      - deploy-azure
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore BackEnd/BE/BE.csproj
    
    - name: Build
      run: dotnet build BackEnd/BE/BE.csproj --configuration Release --no-restore
    
    - name: Publish
      run: dotnet publish BackEnd/BE/BE.csproj --configuration Release --output ./publish-output --no-build
    
    - name: Verify publish output
      run: |
        echo "=== Publish Output Structure ==="
        ls -la publish-output/ | head -20
        echo ""
        echo "=== Checking Required Files ==="
        if [ -f "publish-output/BE.dll" ]; then
          echo "✓ BE.dll found"
        else
          echo "✗ BE.dll not found - searching..."
          find publish-output -name "*.dll" -type f | head -5
        fi
        if [ -f "publish-output/appsettings.json" ]; then
          echo "✓ appsettings.json found"
        else
          echo "✗ appsettings.json not found"
        fi
        if [ -f "publish-output/appsettings.Development.json" ]; then
          echo "✓ appsettings.Development.json found"
        fi
        echo ""
        echo "=== File Count ==="
        echo "Total files: $(find publish-output -type f | wc -l)"
        echo "DLL files: $(find publish-output -name "*.dll" | wc -l)"
    
    - name: Create ZIP package
      run: |
        cd publish-output
        zip -r ../deploy.zip . -q
        cd ..
        echo "ZIP created: $(ls -lh deploy.zip | awk '{print $5}')"
    
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'pawnder-backend-2024'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./deploy.zip
